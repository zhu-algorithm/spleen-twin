[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spleen-twin"
version = "0.1.0"
description = "A digital-twin spleen for antibody generation, affinity maturation and closed-loop design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["immunology", "antibody", "VDJ", "somatic hypermutation",
            "germinal center", "affinity maturation", "digital twin",
            "closed loop", "AIRR"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "biopython>=1.81",
  "olga>=1.2.4",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "pandas>=2.0"]
atlas = ["cellxgene-census", "pandas>=2.0", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spleen_twin = ["data/*.csv", "data/*.fasta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
